ruction:"Bring your attention to the tip of your nose. Notice the cool air entering… the warm air leaving. Stay here."},{duration:120,instruction:'If a thought arises, simply label it "thinking" and return to your breath. No judgment — just gentle return.'},{duration:120,instruction:"Imagine your mind as a still mountain lake. Thoughts are ripples that come and go, but the depths remain undisturbed."},{duration:120,instruction:"Now see the task ahead. Picture yourself fully absorbed, clear, and capable. Every distraction falls away."},{duration:120,instruction:"Rest in this focused stillness. When you open your eyes, carry this single-pointed clarity into your work."}]},{id:"stress",title:"Stress Relief",duration:480,category:"Stress",description:"Release tension and find peace",gradient:"linear-gradient(135deg, #43e97b, #38f9d7)",steps:[{duration:30,instruction:"Close your eyes. Take a long, slow breath in… and sigh it out audibly. Let something go."},{duration:60,instruction:"Scan your body from head to toe. Where do you feel tension? Acknowledge it without trying to fix it."},{duration:90,instruction:"With each exhale, consciously release that tension. Breathe out stress, breathe in ease. You are safe right now."},{duration:90,instruction:"Relax your jaw. Soften your shoulders away from your ears. Unclench your hands. Let your belly be soft."},{duration:120,instruction:"Picture a peaceful place — a forest, a beach, a quiet room. Feel yourself truly there. Let this place hold you."},{duration:90,instruction:"You have handled everything so far. This moment is already passing. Breathe slowly. All is well."}]},{id:"sleep",title:"Sleep Well",duration:720,category:"Sleep",description:"Drift into restful sleep",gradient:"linear-gradient(135deg, #a18cd1, #fbc2eb)",steps:[{duration:60,instruction:"Lie down comfortably. Close your eyes. Take a long, slow breath in… and an even slower breath out."},{duration:120,instruction:"Let your body grow heavy. Feel the mattress cradling every part of you. You have nowhere to go and nothing to do."},{duration:120,instruction:"Starting at your feet, let go completely. Toes… heels… calves… knees… all soft, all heavy, all at rest."},{duration:120,instruction:"Continue up — thighs, hips, belly, chest. Each breath out melts more tension away. You are sinking gently."},{duration:120,instruction:"Shoulders, arms, hands — dissolving into warmth. Your neck is long and soft. Your face is completely relaxed."},{duration:180,instruction:"Imagine a warm, gentle darkness. No thoughts needed now. Just drift… float… let sleep come to you."}]},{id:"anxiety",title:"Calm Anxiety",duration:420,category:"Anxiety",description:"Ease worry and find stillness",gradient:"linear-gradient(135deg, #ffecd2, #fcb69f)",steps:[{duration:30,instruction:"Close your eyes. Place one hand on your chest, one on your belly. Feel your breath move beneath your hands."},{duration:60,instruction:"Breathe in slowly for 4 counts… hold for 1… out for 6. The long exhale activates your calming response."},{duration:90,instruction:"Name five things you can feel right now — the fabric under you, the temperature of the air. Stay in your body."},{duration:90,instruction:"Your anxiety is trying to protect you. Thank it gently, then let it know: you are safe. Right here, right now, you are okay."},{duration:90,instruction:"Picture worry as clouds passing through a wide sky. You are the sky — vast, still, unchanged. The clouds are not you."},{duration:60,instruction:"Take three slow breaths. With each one, feel your nervous system settle. Peace is available to you, always."}]},{id:"gratitude",title:"Gratitude",duration:300,category:"Mindfulness",description:"Cultivate thankfulness",gradient:"linear-gradient(135deg, #ffd89b, #19547b)",steps:[{duration:30,instruction:"Settle in, close your eyes, and take a few natural breaths. Arrive fully in this moment."},{duration:60,instruction:"Bring to mind one small thing you are grateful for today — something simple, like warmth, or the fact that you are breathing."},{duration:60,instruction:"Let the feeling of gratitude grow in your chest. Notice how it changes the quality of your breath, your body."},{duration:60,instruction:"Think of a person who has helped you. Silently wish them well. Send them warmth and appreciation."},{duration:90,instruction:"Rest in appreciation for your own life — its complexity, its gifts, even its challenges. You are here. That is everything."}]},{id:"body-scan",title:"Body Scan",duration:600,category:"Relaxation",description:"Release tension from head to toe",gradient:"linear-gradient(135deg, #e0c3fc, #8ec5fc)",steps:[{duration:30,instruction:"Lie or sit comfortably. Close your eyes. Take three deep breaths and arrive in your body."},{duration:90,instruction:"Bring awareness to the top of your head. Scalp, forehead, eyes — soften each area. There is no right or wrong here."},{duration:90,instruction:"Move down — jaw, throat, shoulders. Notice without judgment. Breathe into any area of tightness and let it soften."},{duration:90,instruction:"Chest and belly — with each breath, feel the gentle expansion. Heart, lungs, stomach — all doing their quiet work."},{duration:120,instruction:"Lower back, hips, thighs, knees, calves, ankles, feet, toes. Send warm attention to every part. Everything relaxes."},{duration:120,instruction:"Feel your whole body at once now — a living, breathing whole. Rest in this full awareness. You are complete."}]},{id:"quick",title:"Quick Reset",duration:180,category:"Quick",description:"3 minutes to reset your mind",gradient:"linear-gradient(135deg, #f7971e, #ffd200)",steps:[{duration:30,instruction:"Stop. Close your eyes. Take the deepest breath you have taken all day. Hold it… and let it go completely."},{duration:60,instruction:"Three more slow breaths. With each inhale, breathe in calm. With each exhale, release whatever you were holding."},{duration:60,instruction:"Notice you are here, alive, present. This moment i
