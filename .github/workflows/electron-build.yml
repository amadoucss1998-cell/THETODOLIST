name: Build Windows Desktop App

on:
  push:
    branches: [claude/cool-mendel-D3FUU]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'package.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Build Electron Windows installer
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-Windows
          path: |
            release/*.exe
            release/*.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/claude/cool-mendel-D3FUU'
        with:
          tag_name: desktop-${{ github.run_number }}
          name: TaskFlow Desktop v1.${{ github.run_number }}
          body: |
            ## TaskFlow Desktop App for Windows

            ### Download options:
            - **TaskFlow Setup.exe** — installer (recommended, creates Start Menu + Desktop shortcut)
            - **TaskFlow.exe** — portable, no install needed

            ### Features:
            - Full task management with drag & drop
            - User authentication (register / sign in)
            - Hourly task reminder notifications (native Windows notifications)
            - Works fully offline — all data stored locally
          files: |
            release/*.exe
            release/*.zip
          draft: false
          prerelease: false
